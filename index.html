<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063d43">
  <title>Mexico Crew 2026 — Riviera Maya Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #102c2e;
      --cream: #f8f0df;
      --sand: #ead5ab;
      --gold: #d6a13a;
      --gold-light: #f1cf78;
      --jade: #14625c;
      --deep-jade: #063d43;
      --coral: #bd684b;
      --white: #fffdf7;
      --shadow: 0 18px 50px rgba(4, 42, 43, 0.22);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(241, 207, 120, 0.5), transparent 25rem),
        linear-gradient(180deg, #f9f1df 0%, #edf0dd 56%, #f8f0df 100%);
    }

    a {
      color: inherit;
    }

    .skip-link {
      position: absolute;
      top: -5rem;
      left: 1rem;
      background: var(--white);
      color: var(--deep-jade);
      padding: 0.75rem 1rem;
      border-radius: 0 0 0.75rem 0.75rem;
      z-index: 20;
      font-weight: 700;
    }

    .skip-link:focus {
      top: 0;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 460px;
      color: var(--white);
      display: grid;
      align-items: end;
      background:
        linear-gradient(90deg, rgba(5, 43, 47, 0.93) 0%, rgba(5, 43, 47, 0.68) 45%, rgba(5, 43, 47, 0.2) 100%),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=85") center/cover;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -10% -130px auto;
      width: 360px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(241, 207, 120, 0.55);
      box-shadow:
        0 0 0 25px rgba(241, 207, 120, 0.08),
        0 0 0 50px rgba(241, 207, 120, 0.05);
      pointer-events: none;
    }

    .hero-inner {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      position: relative;
      z-index: 1;
      padding: 4rem 0 4.5rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 2.2rem;
      height: 1px;
      background: currentColor;
    }
